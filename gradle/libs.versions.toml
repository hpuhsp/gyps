[versions]
# Build Tools
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# SDK Versions
compileSdk = "35"
targetSdk = "35"
minSdk = "24"

# AndroidX Core
core-ktx = "1.15.0"
appcompat = "1.7.0"
activity-ktx = "1.9.3"
fragment-ktx = "1.8.5"
material = "1.12.0"
constraintlayout = "2.2.1"
recyclerview = "1.3.2"

# Lifecycle
lifecycle = "2.8.7"

# Navigation
navigation = "2.8.5"

# Room
room = "2.6.1"

# Paging
paging = "3.3.5"

# AndroidX Additional Components
androidx-annotation = "1.9.1"
androidx-collection = "1.4.2"
androidx-savedstate = "1.2.1"
androidx-arch-core = "2.2.0"
androidx-concurrent = "1.1.0"
androidx-profileinstaller = "1.4.0"
androidx-startup = "1.1.1"
androidx-tracing = "1.2.0"
androidx-versionedparcelable = "1.1.1"
androidx-customview = "1.1.0"
androidx-drawerlayout = "1.1.1"
androidx-coordinatorlayout = "1.1.0"
androidx-viewpager2 = "1.1.0"
androidx-transition = "1.5.0"
androidx-slidingpanelayout = "1.2.0"
androidx-exifinterface = "1.3.7"
androidx-swiperefreshlayout = "1.2.0-alpha01"
androidx-emoji2 = "1.5.0"
androidx-camera = "1.1.0"

# Hilt
hilt = "2.57.2"
hilt-navigation-compose = "1.2.0"

# Coroutines
coroutines = "1.9.0"

# Network
retrofit = "2.11.0"
okhttp = "4.12.0"
okio = "3.9.1"
gson = "2.11.0"
retrofit-url-manager = "1.4.0"

# Image Loading
glide = "5.0.5"

# Compose
compose-bom = "2024.12.01"
compose-compiler = "1.5.15"

# Utilities
timber = "5.0.1"
mmkv = "2.2.4"
immersionbar = "3.0.0"
easypermissions = "3.0.0"
utilcodex = "1.31.0"
eventbus = "3.3.1"

# Router
therouter = "1.3.0"

# Third-Party UI
pictureselector = "v2.7.2"
baserecyclerviewadapterhelper = "3.0.4"
recyclerview-flexibledivider = "1.4.0"
flyco-tablayout = "2.1.2"
material-dialogs = "3.3.0"

# Third-Party Libraries
jetbrains-annotations = "23.0.0"
errorprone = "2.27.0"

# Testing
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
espresso-core = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
# coroutines-test version removed, use coroutines version instead
# coroutines-test = "1.9.0"

[libraries]
# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Paging
androidx-paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Network
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
retrofit-url-manager = { module = "me.jessyan:retrofit-url-manager", version.ref = "retrofit-url-manager" }

# Image Loading
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
glide-okhttp3-integration = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }

# Utilities
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
immersionbar = { module = "com.gyf.immersionbar:immersionbar", version.ref = "immersionbar" }
immersionbar-ktx = { module = "com.gyf.immersionbar:immersionbar-ktx", version.ref = "immersionbar" }
easypermissions = { module = "pub.devrel:easypermissions", version.ref = "easypermissions" }
utilcodex = { module = "com.blankj:utilcodex", version.ref = "utilcodex" }
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }

# Router
therouter-router = { module = "cn.therouter:router", version.ref = "therouter" }
therouter-apt = { module = "cn.therouter:apt", version.ref = "therouter" }
therouter-compose = { module = "cn.therouter:compose", version.ref = "therouter" }

# Third-Party UI
pictureselector = { module = "io.github.lucksiege:pictureselector", version.ref = "pictureselector" }
baserecyclerviewadapterhelper = { module = "com.github.CymChad:BaseRecyclerViewAdapterHelper", version.ref = "baserecyclerviewadapterhelper" }
recyclerview-flexibledivider = { module = "com.yqritc:recyclerview-flexibledivider", version.ref = "recyclerview-flexibledivider" }
flyco-tablayout = { module = "com.flyco.tablayout:FlycoTabLayout_Lib", version.ref = "flyco-tablayout" }
material-dialogs-bottomsheets = { module = "com.afollestad.material-dialogs:bottomsheets", version.ref = "material-dialogs" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
therouter-classpath = { id = "cn.therouter", version.ref = "therouter" }
therouter-plugin = { id = "therouter" }

[bundles]
# AndroidX Core Bundle
androidx-core = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-activity-ktx",
    "androidx-fragment-ktx",
    "material",
    "androidx-constraintlayout",
    "androidx-recyclerview"
]

# Lifecycle Bundle
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-common-java8"
]

# Lifecycle Compose Bundle
lifecycle-compose = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-viewmodel-compose"
]

# Navigation Bundle
navigation = [
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx"
]

# Navigation Compose Bundle
navigation-compose = [
    "androidx-navigation-compose",
    "hilt-navigation-compose"
]

# Room Bundle
room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]

# Paging Bundle
paging = [
    "androidx-paging-runtime-ktx"
]

# Paging Compose Bundle
paging-compose = [
    "androidx-paging-runtime-ktx",
    "androidx-paging-compose"
]

# Coroutines Bundle
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core"
]

# Network Bundle
network = [
    "retrofit",
    "retrofit-converter-gson",
    "okhttp",
    "okhttp-logging-interceptor",
    "gson"
]

# Glide Bundle
glide = [
    "glide",
    "glide-okhttp3-integration"
]

# Compose Bundle
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-foundation",
    "compose-runtime"
]

# Compose Debug Bundle
compose-debug = [
    "compose-ui-tooling"
]

# Utilities Bundle
utilities = [
    "timber",
    "mmkv"
]

# Immersion Bar Bundle
immersionbar = [
    "immersionbar",
    "immersionbar-ktx"
]

# Testing Bundle
testing = [
    "junit",
    "mockk",
    "kotlinx-coroutines-test",
    "turbine"
]

# Android Testing Bundle
android-testing = [
    "androidx-test-ext-junit",
    "androidx-test-espresso-core",
    "mockk-android"
]
