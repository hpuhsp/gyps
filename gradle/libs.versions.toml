[versions]
# Build Tools
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# SDK Versions
compileSdk = "35"
targetSdk = "35"
minSdk = "24"

# AndroidX Core
core-ktx = "1.15.0"
appcompat = "1.7.0"
activity-ktx = "1.9.3"
fragment-ktx = "1.8.5"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"

# Lifecycle
lifecycle = "2.8.7"

# Navigation
navigation = "2.8.5"

# Room
room = "2.6.1"

# Paging
paging = "3.3.5"

# Hilt
hilt = "2.57.2"
hilt-navigation-compose = "1.2.0"

# Coroutines
coroutines = "1.9.0"

# Network
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
retrofit-url-manager = "1.4.0"

# Image Loading
glide = "5.0.5"

# Compose
compose-bom = "2024.12.01"
compose-compiler = "1.5.15"

# Utilities
timber = "5.0.1"
mmkv = "2.2.4"
immersionbar = "3.0.0"
easypermissions = "3.0.0"
utilcodex = "1.31.0"
eventbus = "3.3.1"

# Router
arouter = "1.5.2"
arouter-compiler = "1.5.2"

# Third-Party UI
pictureselector = "v2.7.2"
baserecyclerviewadapterhelper = "3.0.4"
recyclerview-flexibledivider = "1.4.0"
flyco-tablayout = "2.1.2"
material-dialogs = "3.3.0"

# Testing
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
espresso-core = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
coroutines-test = "1.9.0"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity-ktx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-ktx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Paging
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
retrofit-url-manager = { group = "me.jessyan", name = "retrofit-url-manager", version.ref = "retrofit-url-manager" }

# Image Loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-ksp = { group = "com.github.bumptech.glide", name = "ksp", version.ref = "glide" }
glide-okhttp3-integration = { group = "com.github.bumptech.glide", name = "okhttp3-integration", version.ref = "glide" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Utilities
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }
immersionbar = { group = "com.gyf.immersionbar", name = "immersionbar", version.ref = "immersionbar" }
immersionbar-ktx = { group = "com.gyf.immersionbar", name = "immersionbar-ktx", version.ref = "immersionbar" }
easypermissions = { group = "pub.devrel", name = "easypermissions", version.ref = "easypermissions" }
utilcodex = { group = "com.blankj", name = "utilcodex", version.ref = "utilcodex" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }

# Router
arouter-api = { group = "com.alibaba", name = "arouter-api", version.ref = "arouter" }
arouter-compiler = { group = "com.alibaba", name = "arouter-compiler", version.ref = "arouter-compiler" }

# Third-Party UI
pictureselector = { group = "io.github.lucksiege", name = "pictureselector", version.ref = "pictureselector" }
baserecyclerviewadapterhelper = { group = "com.github.CymChad", name = "BaseRecyclerViewAdapterHelper", version.ref = "baserecyclerviewadapterhelper" }
recyclerview-flexibledivider = { group = "com.yqritc", name = "recyclerview-flexibledivider", version.ref = "recyclerview-flexibledivider" }
flyco-tablayout = { group = "com.flyco.tablayout", name = "FlycoTabLayout_Lib", version.ref = "flyco-tablayout" }
material-dialogs-bottomsheets = { group = "com.afollestad.material-dialogs", name = "bottomsheets", version.ref = "material-dialogs" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
# AndroidX Core Bundle
androidx-core = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-activity-ktx",
    "androidx-fragment-ktx",
    "material",
    "androidx-constraintlayout",
    "androidx-recyclerview"
]

# Lifecycle Bundle
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-common-java8"
]

# Lifecycle Compose Bundle
lifecycle-compose = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-viewmodel-compose"
]

# Navigation Bundle
navigation = [
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx"
]

# Navigation Compose Bundle
navigation-compose = [
    "androidx-navigation-compose",
    "hilt-navigation-compose"
]

# Room Bundle
room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]

# Paging Bundle
paging = [
    "androidx-paging-runtime-ktx"
]

# Paging Compose Bundle
paging-compose = [
    "androidx-paging-runtime-ktx",
    "androidx-paging-compose"
]

# Coroutines Bundle
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core"
]

# Network Bundle
network = [
    "retrofit",
    "retrofit-converter-gson",
    "okhttp",
    "okhttp-logging-interceptor",
    "gson"
]

# Glide Bundle
glide = [
    "glide",
    "glide-okhttp3-integration"
]

# Compose Bundle
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-foundation",
    "compose-runtime"
]

# Compose Debug Bundle
compose-debug = [
    "compose-ui-tooling"
]

# Utilities Bundle
utilities = [
    "timber",
    "mmkv",
    "eventbus"
]

# Immersion Bar Bundle
immersionbar = [
    "immersionbar",
    "immersionbar-ktx"
]

# Testing Bundle
testing = [
    "junit",
    "mockk",
    "kotlinx-coroutines-test",
    "turbine"
]

# Android Testing Bundle
android-testing = [
    "androidx-test-ext-junit",
    "androidx-test-espresso-core",
    "mockk-android"
]
